name: Windows release

on:
  push:
    tags:
      - "win-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wepchat-win

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $configVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $expectedTag = "win-v$configVersion"

          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match Tauri version $configVersion (expected $expectedTag)."
          }
          if ($cargoVersion -ne $configVersion) {
            throw "Cargo version $cargoVersion does not match Tauri version $configVersion."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wepchat-win/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wepchat-win/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: wepchat-win
          tagName: win-v__VERSION__
          releaseName: WePChat Windows v__VERSION__
          releaseBody: Windows installer for WePChat v__VERSION__.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
